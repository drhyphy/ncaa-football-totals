name: Season weather revision research collection

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize public archive commits and Pages deployments with existing collectors.
concurrency:
  group: daily-totals-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      collection_failed: ${{ steps.publication.outputs.collection_failed }}
      archive_uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # Verify the source commits retained by previous captures.
      - name: Check the separate fixed UTC season window
        id: decision
        run: python3 scripts/weather_revision_season_status.py decision --root .
      - uses: actions/setup-python@v5
        if: steps.decision.outputs.publish == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements-lock.txt
      - name: Test publication and label-free inventory before collection
        if: steps.decision.outputs.publish == 'true'
        run: |
          python -m unittest discover -s scripts/tests -p test_weather_revision_status.py
          python -m unittest discover -s scripts/tests -p test_weather_revision_season_status.py
          python -m unittest discover -s scripts/tests -p test_weather_revision_model_inventory.py
      - name: Install pinned collector dependencies
        if: steps.decision.outputs.collect == 'true'
        run: python -m pip install -r model/requirements-lock.txt
      - name: Collect immutable forecasts followed by fresh prices
        id: collector
        if: steps.decision.outputs.collect == 'true'
        continue-on-error: true
        timeout-minutes: 20
        working-directory: model
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: python -m ncaaf_model.weather_revision_collector --root . --profile season
      - name: Inventory archived model prerequisites without weather values or labels
        id: inventory
        if: always() && steps.decision.outputs.collect == 'true' && (steps.collector.outcome == 'success' || steps.collector.outcome == 'failure')
        continue-on-error: true
        run: python3 scripts/weather_revision_model_inventory.py --root .
      - name: Publish status and preserve partial or prerequisite failures
        id: publication
        if: always() && steps.decision.outputs.publish == 'true'
        env:
          COLLECTOR_OUTCOME: ${{ steps.collector.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          ATTEMPT_STARTED_AT: ${{ steps.decision.outputs.attempt_started_at }}
        run: |
          if [ "$INVENTORY_OUTCOME" = 'failure' ]; then
            COLLECTOR_OUTCOME='failure'
          fi
          python3 scripts/weather_revision_season_status.py publish --root . --collector-outcome "$COLLECTOR_OUTCOME" --attempt-started-at "$ATTEMPT_STARTED_AT"
      - name: Preserve only public archives, season status and label-free inventory
        id: archive
        if: always() && steps.publication.outcome == 'success'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          paths = [Path('model/data/runtime/weather_revisions'), Path('site/data/weather-revision-season.json'),
                   Path('model/reports/weather_revision_model_inventory.json'), Path('model/reports/WEATHER_REVISION_MODEL_INVENTORY.md')]
          public = [str(path) for path in paths if path.exists()]
          if public:
              subprocess.run(['git', 'add', '--', *public], check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "Archive season weather revision inputs (run $RUN_ID)"
            git push origin HEAD:main
          fi
      - name: Upload the existing site with separate season status
        id: upload
        if: always() && steps.publication.outcome == 'success' && steps.archive.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    if: always() && needs.collect.outputs.publish == 'true' && needs.collect.outputs.archive_uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the collection status
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report partial or failed collection after publication
        if: needs.collect.outputs.collection_failed == 'true'
        run: |
          echo 'Available season archives and attention status were published. Collection or inventory needs attention; active model policies were unchanged.'
          exit 1

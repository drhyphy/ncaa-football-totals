name: ACC availability collection pilot

on:
  schedule:
    - cron: '17,47 0,1,2,10-23 9-16 9 *'
      timezone: America/New_York
    - cron: '17 6 9-16 9 *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-totals-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      collection_failed: ${{ steps.publication.outputs.collection_failed }}
      archive_uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # Verify source blobs recorded by older captures.
      - name: Check the fixed collection window before any requests
        id: decision
        run: python3 scripts/availability_status.py decision --root .
      - uses: actions/setup-python@v5
        if: steps.decision.outputs.publish == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements-lock.txt
      - name: Test aggregate status and failure publication
        if: steps.decision.outputs.publish == 'true'
        run: python -m unittest discover -s scripts/tests -p 'test_availability_status.py'
      - name: Install pinned collection dependencies
        if: steps.decision.outputs.collect == 'true'
        run: python -m pip install -r model/requirements-lock.txt
      - name: Test availability collection before requests
        if: steps.decision.outputs.collect == 'true'
        env:
          PYTHONPATH: model
        run: python -m pytest -q model/tests/test_availability_*.py
      - name: Capture public reports and subsequent prices, including pending reports
        id: collector
        if: steps.decision.outputs.collect == 'true'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: model
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: python -m ncaaf_model.availability_collector --root .
      - name: Publish collection status even after partial or prerequisite failure
        id: publication
        if: always() && steps.decision.outputs.publish == 'true'
        env:
          COLLECTOR_OUTCOME: ${{ steps.collector.outcome }}
          ATTEMPT_STARTED_AT: ${{ steps.decision.outputs.attempt_started_at }}
        run: python3 scripts/availability_status.py publish --root . --collector-outcome "$COLLECTOR_OUTCOME" --attempt-started-at "$ATTEMPT_STARTED_AT"
      - name: Archive only availability receipts and aggregate status
        id: archive
        if: always() && steps.publication.outcome == 'success'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          paths = [Path('model/data/runtime/availability'), Path('site/data/availability.json')]
          public = [str(path) for path in paths if path.exists()]
          if public:
              subprocess.run(['git', 'add', '--', *public], check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "Archive ACC availability pilot (run $RUN_ID)"
            git push origin HEAD:main
          fi
      - name: Upload existing board and aggregate availability status
        id: upload
        if: always() && steps.publication.outcome == 'success' && steps.archive.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    if: always() && needs.collect.outputs.publish == 'true' && needs.collect.outputs.archive_uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy collection status with the existing board
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report collection failure after preserving and publishing available evidence
        if: needs.collect.outputs.collection_failed == 'true'
        run: |
          echo 'Availability failure status and available archives were published. No model or betting policy was changed.'
          exit 1

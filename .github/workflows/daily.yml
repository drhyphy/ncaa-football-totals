name: Daily totals and Pages

on:
  schedule:
    - cron: '30 6 * * *'
      timezone: America/New_York
    - cron: '45 6 * * *'
      timezone: America/New_York
    - cron: '0 7 * * *'
      timezone: America/New_York
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'model/ncaaf_model/**'
      - 'model/tests/**'
      - 'model/config/**'
      - 'model/data/models/**'
      - 'model/requirements-lock.txt'
      - 'scripts/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: read

concurrency:
  group: daily-totals-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      refresh_failed: ${{ steps.publication.outputs.refresh_failed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # Receipt audits verify source blobs at earlier capture commits.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned model dependencies
        run: python -m pip install -r model/requirements-lock.txt
      - name: Test model before fetching live data
        working-directory: model
        run: python -m pytest tests -q
      - name: Test publication and frontend safeguards
        run: |
          python -m pytest scripts/tests -q
          node --test site/tests/*.test.cjs
      - name: Publish current research with provenance checks
        run: python scripts/publish_research.py --root .
      - name: Check whether today's scheduled refresh already succeeded
        id: decision
        run: python scripts/schedule_state.py decision
      - name: Refresh public data, grade ledger, and publish model board
        id: runtime
        if: steps.decision.outputs.refresh == 'true'
        continue-on-error: true
        timeout-minutes: 25
        working-directory: model
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: python -m ncaaf_model.runtime daily
      - name: Prepare publication, including an explicit failure board
        id: publication
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: python scripts/schedule_state.py prepare --outcome "$RUNTIME_OUTCOME"
      - name: Commit only public snapshots and forward ledger
        env:
          RUN_DATE: ${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          allowed = [str(path) for path in map(Path, ['site/data', 'model/ledger', 'model/data/runtime']) if path.exists()]
          if allowed:
              subprocess.run(['git', 'add', '--', *allowed], check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily totals board (run $RUN_DATE)"
            git push origin HEAD:main
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report refresh failure after publishing the unavailable state
        if: needs.publish.outputs.refresh_failed == 'true'
        run: |
          echo 'The unavailable board was published. The live refresh needs attention; the next scheduled attempt can retry.'
          exit 1
